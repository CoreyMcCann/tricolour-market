<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="718" viewBox="0 0 1200 718" role="img" aria-labelledby="title desc">
<title id="title">Two routes to cancellation</title>
<desc id="desc">A map of the actual demo flows. Green boxes are cancellation receipts. Gold boxes are paths that preserve automatic renewal.</desc>
